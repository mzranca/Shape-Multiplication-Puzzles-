<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shape Multiplication Puzzles · 圖形乘法謎題</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--fg:#222;--muted:#666;--card:#fff;--line:#d8d6cf;--accent:#2b6cb0;--ok:#1f8f4e;--bad:#d03a3a;--rev:#d6336c;--hint:#2b6cb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1f;--fg:#eee;--muted:#aaa;--card:#2a2a2d;--line:#484848;--accent:#6ea8e6;--ok:#4cc784;--bad:#ff7a7a;--rev:#ff8fb8;--hint:#7db4f0}}
:root[data-theme="dark"]{--bg:#1d1d1f;--fg:#eee;--muted:#aaa;--card:#2a2a2d;--line:#484848;--accent:#6ea8e6;--ok:#4cc784;--bad:#ff7a7a;--rev:#ff8fb8;--hint:#7db4f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.45}
.wrap{max-width:920px;margin:0 auto;padding:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.35rem;margin:0}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;border-radius:0;background:transparent;color:var(--fg);padding:6px 12px}
.lang button.on{background:var(--accent);color:#fff}
.mode{display:flex;gap:8px;margin-bottom:12px}
.mode button{flex:1;font-size:1.05rem;font-weight:600;padding:10px}
.mode button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:var(--card)}
.controls label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.intro p{margin:0 0 8px;font-size:.92rem}
.legend{display:flex;gap:18px;flex-wrap:wrap}
.legend svg{height:30px;width:auto;overflow:visible}
.score{font-weight:600;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.card.solved{border-color:var(--ok)}
.ch{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:2px}
.card.solved .ch .st{color:var(--ok);font-weight:700}
.board{position:relative;width:100%;max-width:240px;aspect-ratio:1;margin:0 auto}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.shape{fill:var(--card);stroke:var(--fg);stroke-width:1.6}
.ln{stroke:var(--fg);stroke-width:1.4}
.gv{font:600 17px system-ui,sans-serif;text-anchor:middle;fill:var(--fg)}
.board input{position:absolute;width:15%;height:13%;transform:translate(-50%,-50%);border:0;border-bottom:2px dashed var(--accent);background:transparent;color:var(--fg);text-align:center;font:600 1.1rem system-ui,sans-serif;padding:0;border-radius:4px;outline:none}
.board input:focus{background:color-mix(in srgb,var(--accent) 18%,transparent);border-bottom-style:solid}
.board input.ok{color:var(--ok);font-weight:800;border-bottom-color:var(--ok)}
.board input.bad{color:var(--bad);font-weight:900;font-size:1.25rem;border-bottom:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}
.board input.hint{color:var(--hint)}
.board input.rev{color:var(--rev)}
.msg{min-height:1.3em;font-size:.82rem;margin-top:4px;color:var(--muted)}
.msg.good{color:var(--ok)}.msg.warn{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
<div class="head">
 <h1 data-i="title"></h1>
 <div class="lang" role="group" aria-label="Language">
  <button id="l-en">English</button><button id="l-zh">繁體中文</button>
 </div>
</div>

<div class="mode" role="group"><button id="m-mul"></button><button id="m-div"></button></div>
<div class="controls">
 <label><span data-i="count"></span>
  <select id="count"><option>2</option><option>4</option><option selected>6</option><option>8</option></select></label>
 <label><span data-i="max"></span>
  <select id="max"><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option></select></label>
 <label><span data-i="lvl"></span>
  <select id="lvl"><option value="2" data-i="easy"></option><option value="1" data-i="med" selected></option><option value="0" data-i="hard"></option></select></label>
 <button class="primary" id="gen" data-i="gen"></button>
 <button id="reveal" data-i="show"></button>
</div>

<div class="intro">
 <p data-i="intro"></p>
 <div class="legend" id="legend">
  <svg viewBox="0 0 150 30"><g class="shape"><circle cx="15" cy="15" r="12"/><circle cx="75" cy="15" r="12"/><rect x="125" y="3" width="24" height="24"/></g><text x="45" y="21" font-size="18" text-anchor="middle" fill="currentColor">×</text><text x="102" y="21" font-size="18" text-anchor="middle" fill="currentColor">=</text></svg>
  <svg viewBox="0 0 160 30"><g class="shape"><polygon points="15,2 3,26 27,26"/><polygon points="75,2 63,26 87,26"/><circle cx="137" cy="15" r="12"/></g><text x="45" y="21" font-size="18" text-anchor="middle" fill="currentColor">×</text><text x="102" y="21" font-size="18" text-anchor="middle" fill="currentColor">=</text></svg>
 </div>
</div>

<p class="score" id="score"></p>
<div class="grid" id="grid"></div>
</div>

<script>
const I18N={
en:{titlemul:"Shape Multiplication Puzzles",titlediv:"Shape Division Puzzles",mmul:"× Multiply",mdiv:"÷ Divide",count:"Puzzles",max:"Times tables up to",lvl:"Difficulty",easy:"Easy (more hints)",med:"Medium",hard:"Hard (fewest hints)",gen:"New puzzles",show:"Show answers",hide:"Hide answers",
introdiv:"Fill in the shapes with numbers from the multiplication tables so that the top and bottom, left and right sides are aligned. Divide the square by a circle to get the other circle, and divide a circle by a triangle to get the triangle next to it.",
intromul:"Fill in the shapes with numbers from the multiplication tables so that the top and bottom, left and right sides are aligned. When you multiply two identical shapes, the product equals the number inside the next shape.",
solved:"Solved",check:"Check",hint:"Hint",done:"Solved! 🎉",fill:"Fill in every empty box first.",wrong:n=>n+(n>1?" boxes are":" box is")+" not right yet. Try again!",right:"All correct so far — keep going!",puz:"Puzzle"},
zh:{titlemul:"圖形乘法謎題",titlediv:"圖形除法謎題",mmul:"× 乘法",mdiv:"÷ 除法",count:"題數",max:"乘法表範圍(最大到)",lvl:"難度",easy:"簡單(提示較多)",med:"中等",hard:"困難(提示最少)",gen:"產生新題目",show:"顯示答案",hide:"隱藏答案",
introdiv:"請利用乘法表想一想,把數字填入圖形,使上下、左右互相對應。方形除以圓形,得到另一個圓形;圓形除以三角形,得到旁邊的三角形。",
intromul:"請從乘法表中選出數字填入圖形,使上下、左右互相對應。兩個相同圖形裡的數字相乘,積就是下一個圖形裡的數字。",
solved:"已完成",check:"檢查",hint:"提示",done:"答對了!🎉",fill:"請先把所有空格填滿。",wrong:n=>"還有 "+n+" 格不對,再想想看!",right:"目前都正確,繼續加油!",puz:"第"}
};
let lang=(navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en';
try{const s=localStorage.getItem('lang');if(s)lang=s}catch(e){}
const T=k=>I18N[lang][k];

const TRI=[0,2,6,8];
const POS=[[30,30],[100,30],[170,30],[30,100],[100,100],[170,100],[30,170],[100,170],[170,170]];
function cells(a,b,c,d){const top=a*b,right=b*c,bottom=c*d,left=d*a;return [a,top,b,left,top*bottom,right,d,bottom,c];}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function countSol(max,g,vals){let n=0;
 for(let a=1;a<=max;a++)for(let b=1;b<=max;b++)for(let c=1;c<=max;c++)for(let d=1;d<=max;d++){
  const v=cells(a,b,c,d);if(g.every(i=>v[i]===vals[i])){if(++n>1)return n}}
 return n}
function makePuzzle(max,extra,div){
 for(;;){
  const t=[0,0,0,0].map(()=>1+rnd(max));
  if(t.filter(x=>x===1).length>1)continue;
  const vals=cells(...t);if(vals[4]>100)continue;
  const order=shuffle([0,1,2,3,4,5,6,7,8]);if(div){order.splice(order.indexOf(4),1);order.unshift(4)}const g=[];
  while(countSol(max,g,vals)!==1&&g.length<9)g.push(order[g.length]);
  for(let i=g.length-1;i>=0;i--){if(div&&g[i]===4)continue;const h=g.filter((_,k)=>k!==i);if(countSol(max,h,vals)===1)g.splice(i,1)}
  const rest=order.filter(i=>!g.includes(i));
  for(let k=0;k<extra&&k<rest.length;k++)g.push(rest[k]);
  if(g.length<3)continue;
  return {vals,givens:g,entries:{},mark:{},msg:'',solved:false};
 }}

let puzzles=[],revealed=false,mode='mul';

function blanks(p){return p.vals.map((_,i)=>i).filter(i=>!p.givens.includes(i))}
function cardHTML(p,n){
 let s='<svg viewBox="0 0 200 200" aria-hidden="true">';
 [[0,1],[1,2],[3,4],[4,5],[6,7],[7,8],[0,3],[3,6],[1,4],[4,7],[2,5],[5,8]].forEach(([a,b])=>s+=`<line class="ln" x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}"/>`);
 p.vals.forEach((v,i)=>{const [x,y]=POS[i],tri=TRI.includes(i);
  if(tri)s+=`<polygon class="shape" points="${x},${y-19} ${x-21},${y+16} ${x+21},${y+16}"/>`;
  else if(i===4)s+=`<rect class="shape" x="${x-19}" y="${y-19}" width="38" height="38"/>`;
  else s+=`<circle class="shape" cx="${x}" cy="${y}" r="20"/>`;
  if(p.givens.includes(i))s+=`<text class="gv" x="${x}" y="${y+(tri?9:6)}">${v}</text>`;});
 s+='</svg>';
 const inputs=blanks(p).map(i=>{const [x,y]=POS[i];const tri=TRI.includes(i);
  const val=revealed?p.vals[i]:(p.entries[i]??'');
  const cls=revealed?'rev':(p.mark[i]||'');
  return `<input data-p="${n}" data-c="${i}" class="${cls}" value="${val}" inputmode="numeric" maxlength="3" autocomplete="off" ${revealed?'readonly':''} style="left:${x/2}%;top:${(y+(tri?7:0))/2}%" aria-label="${T('puz')} ${n+1}">`}).join('');
 const label=lang==='zh'?`${T('puz')} ${n+1} 題`:`${T('puz')} ${n+1}`;
 return `<div class="card${p.solved?' solved':''}" data-card="${n}"><div class="ch"><span>${label}</span><span class="st">${p.solved?'✓':''}</span></div>
 <div class="board">${s}${inputs}</div>
 
 <div class="msg ${p.solved?'good':''}">${p.solved?T('done'):p.msg}</div></div>`;
}
function renderCard(n){
 const el=document.querySelector(`[data-card="${n}"]`);
 const tmp=document.createElement('div');tmp.innerHTML=cardHTML(puzzles[n],n);
 el.replaceWith(tmp.firstElementChild);updateScore();
}
function render(){
 document.getElementById('grid').innerHTML=puzzles.map((p,i)=>cardHTML(p,i)).join('');
 updateScore();
}
function updateScore(){
 document.getElementById('score').textContent=`${T('solved')}: ${puzzles.filter(p=>p.solved).length} / ${puzzles.length}`;
}
function isSolved(p){return blanks(p).every(i=>+p.entries[i]===p.vals[i])}

function renderLegend(){
 const sh=(t,x)=>t==='c'?`<circle cx="${x+12}" cy="15" r="12"/>`:t==='s'?`<rect x="${x}" y="3" width="24" height="24"/>`:`<polygon points="${x+12},2 ${x},26 ${x+24},26"/>`;
 const row=(a,b,c,op)=>`<svg viewBox="0 0 160 30"><g class="shape">${sh(a,3)}${sh(b,63)}${sh(c,125)}</g><text x="45" y="21" font-size="18" text-anchor="middle" fill="currentColor">${op}</text><text x="102" y="21" font-size="18" text-anchor="middle" fill="currentColor">=</text></svg>`;
 document.getElementById('legend').innerHTML=mode==='mul'?row('c','c','s','×')+row('t','t','c','×'):row('s','c','c','÷')+row('c','t','t','÷');
}
function applyLang(){
 document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
 document.querySelectorAll('[data-i]').forEach(e=>{let k=e.dataset.i;if(k==='title'||k==='intro')k+=mode;e.textContent=T(k)});
 document.title=T('title'+mode);
 document.getElementById('m-mul').textContent=T('mmul');document.getElementById('m-div').textContent=T('mdiv');
 document.getElementById('m-mul').classList.toggle('on',mode==='mul');document.getElementById('m-div').classList.toggle('on',mode==='div');
 renderLegend();
 document.getElementById('reveal').textContent=revealed?T('hide'):T('show');
 document.getElementById('l-en').classList.toggle('on',lang==='en');
 document.getElementById('l-zh').classList.toggle('on',lang==='zh');
 if(puzzles.length)render();
}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}applyLang()}

function generate(){
 revealed=false;
 const n=+count.value,max=+document.getElementById('max').value,extra=+lvl.value;
 puzzles=Array.from({length:n},()=>makePuzzle(max,extra,mode==='div'));
 applyLang();
}

const grid=document.getElementById('grid');
const timers={};
function allFilled(p){return blanks(p).every(i=>(p.entries[i]||'')!=='')}
function paint(n){const p=puzzles[n];document.querySelectorAll(`input[data-p="${n}"]`).forEach(el=>el.className=p.mark[+el.dataset.c]||'')}
// Check only once every blank in this puzzle is filled
function evaluate(n){
 const p=puzzles[n];clearTimeout(timers[n]);
 p.mark={};
 if(!allFilled(p)){paint(n);return}
 blanks(p).forEach(i=>p.mark[i]=+p.entries[i]===p.vals[i]?'ok':'bad');
 const was=p.solved;p.solved=isSolved(p);
 if(p.solved!==was)renderCard(n);else paint(n);
}
grid.addEventListener('input',e=>{
 const el=e.target;if(el.tagName!=='INPUT')return;
 const n=+el.dataset.p,c=+el.dataset.c,p=puzzles[n];
 el.value=el.value.replace(/\D/g,'').slice(0,3);
 p.entries[c]=el.value;clearTimeout(timers[n]);p.mark={};
 if(p.solved){p.solved=false;renderCard(n);const ne=document.querySelector(`input[data-p="${n}"][data-c="${c}"]`);ne.focus();ne.setSelectionRange(9,9)}
 else paint(n);
 if(allFilled(p)){
  if(el.value.length>=String(p.vals[c]).length)evaluate(n);
  else timers[n]=setTimeout(()=>evaluate(n),900);
 }
});
grid.addEventListener('focusout',e=>{
 const el=e.target;if(el.tagName!=='INPUT'||el.readOnly)return;
 const n=+el.dataset.p;if(allFilled(puzzles[n]))evaluate(n);
});
grid.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
 const all=[...grid.querySelectorAll('input:not([readonly])')];
 const i=all.indexOf(e.target);(all[i+1]||all[0])?.focus();
});

document.getElementById('gen').onclick=generate;
['count','max','lvl'].forEach(id=>document.getElementById(id).onchange=generate);
document.getElementById('reveal').onclick=()=>{revealed=!revealed;applyLang()};
document.getElementById('l-en').onclick=()=>setLang('en');
document.getElementById('l-zh').onclick=()=>setLang('zh');
document.getElementById('m-mul').onclick=()=>{mode='mul';generate()};
document.getElementById('m-div').onclick=()=>{mode='div';generate()};
const count=document.getElementById('count'),lvl=document.getElementById('lvl');
generate();
</script>
</body>
</html>
